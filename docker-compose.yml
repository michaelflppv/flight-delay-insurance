version: '3.8'

services:
  api:
    build: .
    container_name: flight-insurance-api
    ports:
      - "5000:5000"
    volumes:
      # Mount models directory
      - ./models:/app/models:ro
      # Mount data directory for training
      - ./data:/app/data:ro
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
      - LOG_LEVEL=INFO
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
