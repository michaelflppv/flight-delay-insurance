[tool.poetry]
name = "flight-delay-insurance"
version = "0.1.0"
description = "Web3 platform combining ML with blockchain for decentralized flight delay insurance"
authors = ["Mikhail Filippov <mikhail.filippov@students.uni-mannheim.de>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.scripts]
flight-train = "scripts.train:main"
flight-serve = "scripts.serve:main"
flight-download = "scripts.download_data:main"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.3.3"
scikit-learn = "^1.8.0"
numpy = "^2.4.0"
joblib = "^1.5.3"
flask = "^3.0.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
flask-cors = "^4.0.0"
kagglehub = "^0.3.4"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"
pandas-stubs = "~=2.3.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
jupyter = "^1.0.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
